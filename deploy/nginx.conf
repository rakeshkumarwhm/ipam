# /etc/nginx/conf.d/ipam.conf
server {
    listen 80;
    server_name ipam.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ipam.example.com;

    ssl_certificate     /etc/ssl/ipam/fullchain.pem;
    ssl_certificate_key /etc/ssl/ipam/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Optional: restrict to management networks
    # allow 10.0.0.0/8; deny all;

    root /opt/ipam/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, don't append client-supplied values
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;                         # subnet scans can take a while
        limit_req zone=ipam_login burst=10 nodelay;
    }
    location / { try_files $uri /index.html; }
}
# Put this in the http {} context:
# limit_req_zone $binary_remote_addr zone=ipam_login:10m rate=30r/m;
